name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            dependencies: x64
          - platform: ARM64
            dependencies: arm64
    env:
      Configuration: Release
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Create test signing certificate
        id: cert
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString()
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Eikon" `
            -KeyUsage DigitalSignature -FriendlyName "Eikon CI test certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pfx = Join-Path $env:RUNNER_TEMP "Eikon.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Export-Certificate -Cert $cert -FilePath artifacts\Eikon.cer | Out-Null
          "pfx=$pfx" >> $env:GITHUB_OUTPUT
          "password=$password" >> $env:GITHUB_OUTPUT
          Write-Output "::add-mask::$password"

      - name: Restore
        run: msbuild Eikon.sln /t:Restore /p:Configuration=${{ env.Configuration }} /p:Platform=${{ matrix.platform }} /v:minimal

      - name: Build and package
        run: >-
          msbuild Eikon.sln /m /v:minimal "/clp:ErrorsOnly;Summary" /bl:artifacts\build.binlog
          /p:Configuration=${{ env.Configuration }}
          /p:Platform=${{ matrix.platform }}
          /p:AppxBundle=Never
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:GenerateAppxPackageOnBuild=true
          /p:AppxPackageDir=${{ github.workspace }}\artifacts\AppPackages\
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ steps.cert.outputs.pfx }}
          /p:PackageCertificatePassword=${{ steps.cert.outputs.password }}

      - name: List packages
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts\AppPackages) {
            Get-ChildItem artifacts\AppPackages -Recurse -File |
              ForEach-Object { "{0,10:N0} KB  {1}" -f ($_.Length / 1KB), $_.FullName.Substring((Get-Location).Path.Length + 1) }
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Eikon-${{ matrix.platform }}
          path: |
            artifacts/AppPackages/**/Eikon_*.msix
            artifacts/AppPackages/**/Dependencies/${{ matrix.dependencies }}/*.msix
            artifacts/AppPackages/**/Dependencies/${{ matrix.dependencies }}/*.appx
            artifacts/Eikon.cer
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Eikon-${{ matrix.platform }}-binlog
          path: artifacts/build.binlog

  test:
    name: Core tests (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Eikon.Core.Tests
        run: >-
          msbuild tests\Eikon.Core.Tests\Eikon.Core.Tests.vcxproj /m /v:minimal "/clp:ErrorsOnly;Summary"
          /p:Configuration=Release
          /p:Platform=x64

      - name: Run Eikon.Core.Tests
        shell: pwsh
        run: |
          & "tests\Eikon.Core.Tests\bin\x64\Release\Eikon.Core.Tests.exe"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Eikon.Core.Tests failed ($LASTEXITCODE failed checks)"
            exit 1
          }
